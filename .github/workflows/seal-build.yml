name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAVEN_OPTS: "-Xmx1g -Duser.name=britter"
      SKIP_GATES: >-
        -Drat.skip=true -Dcheckstyle.skip=true -Dfindbugs.skip=true -Dpmd.skip=true
        -Dcpd.skip=true -Dclirr.skip=true -Danimal.sniffer.skip=true -Djapicmp.skip=true
        -Djacoco.skip=true -Dcobertura.skip=true -Dmaven.javadoc.skip=true
        -Dmaven.source.skip=true -Dgpg.skip=true -Dassembly.skipAssembly=true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8 (reference Build-Jdk 1.8.0_65)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.3.9
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.3.9/apache-maven-3.3.9-bin.tar.gz \
            || curl -fsSL -o /tmp/maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.3.9/binaries/apache-maven-3.3.9-bin.tar.gz
          sudo tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.3.9/bin" >> "$GITHUB_PATH"

      - name: Build and test (full suite)
        if: ${{ inputs.test-filter == '' }}
        run: mvn -B -V -e clean package -Prelease $SKIP_GATES

      - name: Build and test (filtered)
        if: ${{ inputs.test-filter != '' }}
        run: mvn -B -V -e clean package -Prelease $SKIP_GATES -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false

      - name: Test results per class and skip reasons
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do sed -n 4p "$f"; done
          echo "--- skipped tests (with reasons) ---"
          grep -B1 "<skipped" target/surefire-reports/*.xml || echo "No skipped tests."

      - name: Collect release jars
        run: |
          mkdir -p release-out
          cp target/commons-fileupload-1.3.2.jar target/commons-fileupload-1.3.2-tests.jar release-out/
          ls -l release-out

      - uses: actions/upload-artifact@v4
        with:
          name: commons-fileupload-jars
          path: release-out/*.jar
          if-no-files-found: error
